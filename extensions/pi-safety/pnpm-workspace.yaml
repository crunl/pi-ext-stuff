allowBuilds:
  "@google/genai": true
  esbuild: true
  esbuild@0.28.2: true
  protobufjs: true
  # tree-sitter-bash's `install` script runs node-gyp-build, which compiles the
  # native Node binding. pi-safety parses through web-tree-sitter and the
  # package's shipped tree-sitter-bash.wasm, so the native binding is never
  # loaded and building it would only add a toolchain dependency.
  tree-sitter-bash: false
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@1.1.0'
  - '@earendil-works/pi-ai@1.1.0'
  - '@earendil-works/pi-coding-agent@1.1.0'
  - '@earendil-works/pi-telemetry@1.1.0'
  - '@earendil-works/pi-tui@1.1.0'
  - '@earendil-works/chord@1.1.0'
  - '@anthropic-ai/sandbox-runtime@0.0.77'
  - '@earendil-works/pi-codemode@1.1.0'
  - '@earendil-works/pi-mcp@1.1.0'
